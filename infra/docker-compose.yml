# Local dev stack. `postgres` is real and runnable today. The six service
# blocks below are commented out until each has actual application code and
# a Dockerfile -- listed here so the intended full topology is documented in
# one place, not scattered across service READMEs, but nothing here should
# claim to work before it does.
#
# Bring up just the database:
#   docker compose -f infra/docker-compose.yml up -d postgres
#
# Uncomment a service block once services/<name>/ has a working Dockerfile.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meridian-postgres
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_dev_only
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - meridian_pg_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

